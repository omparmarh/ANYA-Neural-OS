<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#05070c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="AVNI - Autonomous Voice Neural Interface. High-performance cross-platform AI operating agent with native device controls, timers, alarms, and multi-model failover." />
    <title>AVNI · Neural AI Operating Assistant</title>

    <!-- AVNI Logo Favicon -->
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./avni-logo.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Shell styles: dark background while JS parses -->
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; background: #030508; overflow: hidden; }

      /* Loader stays until React mounts, then smoothly fades out */
      #root-loader {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 16px;
        background: #030508;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }

      /* JS hides it the moment React mounts */
      #root-loader.hide {
        opacity: 0 !important;
        visibility: hidden !important;
        pointer-events: none !important;
      }

      .rl-ring {
        width: 48px; height: 48px;
        border-radius: 50%;
        border: 2px solid rgba(34,211,238,0.15);
        border-top-color: #22d3ee;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      .rl-text {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.65rem;
        letter-spacing: 0.22em;
        color: rgba(34,211,238,0.7);
        text-transform: uppercase;
      }

      #root-fallback-action {
        display: none;
        margin-top: 12px;
        padding: 6px 14px;
        background: rgba(34,211,238,0.15);
        border: 1px solid rgba(34,211,238,0.4);
        color: #22d3ee;
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.7rem;
        border-radius: 8px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <!-- Initial shell loader -->
    <div id="root-loader">
      <div class="rl-ring"></div>
      <div class="rl-text" id="rl-status">AVNI NEURAL OS</div>
      <button id="root-fallback-action" onclick="window.location.reload()">RELOAD CORE</button>
    </div>

    <div id="root"></div>

    <script>
      (function() {
        var loader = document.getElementById('root-loader');
        var status = document.getElementById('rl-status');
        var btn = document.getElementById('root-fallback-action');

        function hideLoader() {
          if (loader) loader.classList.add('hide');
        }

        // Hide when React renders into root
        try {
          var obs = new MutationObserver(function() {
            var r = document.getElementById('root');
            if (r && r.children.length > 0) {
              hideLoader();
              obs.disconnect();
            }
          });
          obs.observe(document.getElementById('root'), { childList: true, subtree: true });
        } catch(e) {}

        // Global fallback if bundle takes > 12s
        setTimeout(function() {
          var r = document.getElementById('root');
          if (!r || r.children.length === 0) {
            if (status) status.textContent = 'INITIALIZATION TIMEOUT';
            if (btn) btn.style.display = 'block';
          }
        }, 12000);

        // Catch uncaught JS errors and display
        window.addEventListener('error', function(e) {
          console.error('Core startup error:', e.error || e.message);
          var r = document.getElementById('root');
          if (!r || r.children.length === 0) {
            if (status) status.textContent = 'SYSTEM LOAD ERROR';
            if (btn) btn.style.display = 'block';
          }
        });
      })();
    </script>

    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
