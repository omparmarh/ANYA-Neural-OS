services:
  - type: web
    name: anya-telephony-backend
    env: node
    plan: free
    rootDir: freellmapi/server
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      - key: ENCRYPTION_KEY
        value: e7b76fb5b263e422c9cef2a2ea58a640160bc485d79d106f35695b24a51fbe15
